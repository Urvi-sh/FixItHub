<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues | FixItHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<header id="navbar"></header>
<main class="container">
<div class="page-head">
<div><h1>Campus issues</h1><p class="muted">Browse what has been reported and upvote the problems that affect you.</p></div>
<a class="btn btn-accent" href="/pages/issue-form.html">Report an issue</a>
</div>
<div class="tabs" role="tablist" id="scopeTabs">
<button class="tab" role="tab" data-scope="all" aria-selected="true">All issues</button>
<button class="tab" role="tab" data-scope="mine" aria-selected="false">My issues</button>
<button class="tab hidden" role="tab" data-scope="assigned" aria-selected="false" id="assignedTab">Assigned to me</button>
</div>
<form class="filters" id="filters" role="search">
<input class="input search" id="search" type="search" placeholder="Search title, description or location" aria-label="Search issues">
<select class="input" id="status" aria-label="Status"></select>
<select class="input" id="category" aria-label="Category"></select>
<select class="input" id="building" aria-label="Building"></select>
<select class="input" id="sort" aria-label="Sort by">
<option value="-createdAt">Newest first</option>
<option value="createdAt">Oldest first</option>
<option value="-upvoteCount">Most upvoted</option>
<option value="-commentCount">Most discussed</option>
</select>
</form>
<div class="grid-cards" id="list"></div>
<div class="pager" id="pager"></div>
</main>
<footer id="footer"></footer>
<script type="module" src="/js/pages/issues.js"></script>
</body>
</html>
