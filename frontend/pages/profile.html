<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | FixItHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>
<body>
<header id="navbar"></header>
<main class="container">
<div class="page-head"><h1>Your profile</h1></div>
<div class="two-col">
<form class="card" id="profileForm" novalidate>
<h2>Details</h2>
<div class="form-alert hidden" role="alert"></div>
<div class="row" style="margin-bottom:1rem"><div id="avatarBox"></div>
<div class="field" style="margin:0"><label for="avatar">Profile picture</label><input id="avatar" name="avatar" type="file" accept="image/jpeg,image/png,image/webp">
<div class="field-error" data-error-for="avatar"></div></div></div>
<div class="form-grid">
<div class="field"><label for="name">Full name</label><input class="input" id="name" name="name" required><div class="field-error" data-error-for="name"></div></div>
<div class="field"><label for="email">Email</label><input class="input" id="email" name="email" disabled><div class="hint">Email cannot be changed.</div></div>
<div class="field"><label for="department">Department</label><select class="input" id="department" name="department"></select><div class="field-error" data-error-for="department"></div></div>
<div class="field"><label for="phone">Phone</label><input class="input" id="phone" name="phone" type="tel"><div class="field-error" data-error-for="phone"></div></div>
</div>
<button class="btn btn-accent" type="submit">Save changes</button>
</form>
<form class="card" id="pwForm" novalidate>
<h2>Change password</h2>
<div class="form-alert hidden" role="alert"></div>
<div class="field"><label for="currentPassword">Current password</label><input class="input" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required><div class="field-error" data-error-for="currentPassword"></div></div>
<div class="field"><label for="newPassword">New password</label><input class="input" id="newPassword" name="newPassword" type="password" autocomplete="new-password" required><div class="field-error" data-error-for="newPassword"></div></div>
<button class="btn" type="submit">Update password</button>
</form>
</div>
</main>
<footer id="footer"></footer>
<script type="module" src="/js/pages/profile.js"></script>
</body>
</html>
